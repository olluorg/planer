name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Сайт thedad.ru → GitHub Pages публичного репозитория ─────────────────
  # Pages на бесплатном плане работает только у ПУБЛИЧНЫХ репозиториев. Код
  # живёт в приватном planer, поэтому собранный сайт кладётся в ветку gh-pages
  # публичного thedad-releases. Туда уходит только dist — то же самое, что и так
  # скачивает браузер любого посетителя, исходников там нет.
  publish-site:
    runs-on: ubuntu-latest
    concurrency:
      group: site
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
        env:
          # Адрес sync-сервера (Plus). Пока Plus скрыт флагом — можно не задавать.
          VITE_SYNC_SERVER_URL: ${{ vars.VITE_SYNC_SERVER_URL }}
          # OAuth client_id для копии в Google Диск. Не задан → раздел скрыт.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # '1' открывает Plus (синк через свой сервер). Включать, когда сервер
          # поднят и биллинг работает; до тех пор не задавать.
          VITE_FEATURE_PLUS: ${{ vars.VITE_FEATURE_PLUS }}
      - name: Publish to thedad-releases/gh-pages
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cd dist
          # .nojekyll — иначе Pages прогонит файлы через Jekyll и спрячет всё,
          # что начинается с подчёркивания.
          touch .nojekyll
          test -f CNAME || echo "thedad.ru" > CNAME
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сайт из ${GITHUB_SHA::7}"
          # Каждый раз ветка с нуля: история сборок никому не нужна и только
          # раздувала бы репозиторий.
          git push -q -f "https://x-access-token:${TOKEN}@github.com/uyellowline/thedad-releases.git" gh-pages

  # ── Артефакты → публичный репозиторий релизов ───────────────────────────
  # Код лежит в приватном репозитории, а скачивать сборки и заводить issue
  # пользователи должны в публичном. RELEASES_TOKEN — PAT с правом contents:write
  # на uyellowline/thedad-releases (github.token сюда не дотягивается).
  release-extension:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build Chrome extension
        run: bun run build:ext

      - name: Zip extension
        run: cd dist && zip -r ../planer-extension.zip .

      - name: Checksum
        run: sha256sum planer-extension.zip > SHA256SUMS-extension.txt

      - id: meta
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: uyellowline/thedad-releases
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          NOTES="Расширение Chrome: \`chrome://extensions\` → Режим разработчика → Загрузить распакованное (или распаковать zip).

          Десктоп для Windows: файл \`THEDAD Setup\`.

          Сборка: \`${{ github.sha }}\`"

          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            gh release upload "$TAG" planer-extension.zip SHA256SUMS-extension.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "THEDAD ${TAG}" \
              --notes "$NOTES" \
              planer-extension.zip SHA256SUMS-extension.txt
          fi

  # ── Десктоп (Windows) → тот же релиз ────────────────────────────────────
  # Идёт после расширения: релиз к этому моменту уже существует, и два задания
  # не пытаются создать один и тот же тег одновременно.
  release-desktop:
    needs: release-extension
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build desktop installer
        run: bun run desktop:dist
        env:
          VITE_SYNC_SERVER_URL: ${{ vars.VITE_SYNC_SERVER_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_FEATURE_PLUS: ${{ vars.VITE_FEATURE_PLUS }}
          # Публикацию делаем сами через gh — иначе electron-builder полез бы
          # в приватный репозиторий, откуда пользователи скачать не смогут.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: uyellowline/thedad-releases
          TAG: ${{ needs.release-extension.outputs.tag }}
        run: |
          # latest.yml обязателен: по нему electron-updater находит обновление.
          gh release upload "$TAG" --repo "$REPO" --clobber \
            release/*.exe release/*.blockmap release/latest.yml
