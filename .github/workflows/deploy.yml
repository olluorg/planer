name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Web app → GitHub Pages ──────────────────────────────────────────────
  build-pages:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        name: Build (GitHub Pages)
        env:
          # Адрес прод sync-сервера. Задать в Settings → Secrets and variables →
          # Actions → Variables: VITE_SYNC_SERVER_URL = https://sync.thedad.ru
          # Не задан → в сборке останется localhost, и синк у тестеров не заработает.
          VITE_SYNC_SERVER_URL: ${{ vars.VITE_SYNC_SERVER_URL }}
          # OAuth client_id для бэкапа в Google Диск. Не задан → раздел скрыт.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ── Артефакты → публичный репозиторий релизов ───────────────────────────
  # Код лежит в приватном репозитории, а скачивать сборки и заводить issue
  # пользователи должны в публичном. RELEASES_TOKEN — PAT с правом contents:write
  # на uyellowline/thedad-releases (github.token сюда не дотягивается).
  release-extension:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build Chrome extension
        run: bun run build:ext

      - name: Zip extension
        run: cd dist && zip -r ../planer-extension.zip .

      - name: Checksum
        run: sha256sum planer-extension.zip > SHA256SUMS-extension.txt

      - id: meta
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: uyellowline/thedad-releases
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          NOTES="Расширение Chrome: \`chrome://extensions\` → Режим разработчика → Загрузить распакованное (или распаковать zip).

          Десктоп для Windows: файл \`THEDAD Setup\`.

          Сборка: \`${{ github.sha }}\`"

          if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
            gh release upload "$TAG" planer-extension.zip SHA256SUMS-extension.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "THEDAD ${TAG}" \
              --notes "$NOTES" \
              planer-extension.zip SHA256SUMS-extension.txt
          fi

  # ── Десктоп (Windows) → тот же релиз ────────────────────────────────────
  # Идёт после расширения: релиз к этому моменту уже существует, и два задания
  # не пытаются создать один и тот же тег одновременно.
  release-desktop:
    needs: release-extension
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build desktop installer
        run: bun run desktop:dist
        env:
          VITE_SYNC_SERVER_URL: ${{ vars.VITE_SYNC_SERVER_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Публикацию делаем сами через gh — иначе electron-builder полез бы
          # в приватный репозиторий, откуда пользователи скачать не смогут.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: uyellowline/thedad-releases
          TAG: ${{ needs.release-extension.outputs.tag }}
        run: |
          # latest.yml обязателен: по нему electron-updater находит обновление.
          gh release upload "$TAG" --repo "$REPO" --clobber \
            release/*.exe release/*.blockmap release/latest.yml
