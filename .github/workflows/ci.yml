name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:
    branches: [main, redesign]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: E2E (Playwright, по продакшен-сборке)
        # Ловит то, чего не видно в dev: CSP, потерю данных при перезагрузке,
        # схлопывание вёрстки на узких экранах.
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test
      - name: Bundle size guard
        # Меряем только код и его ассеты (dist/assets): обои и контент-паки лежат
        # рядом статикой и к весу JS отношения не имеют. Порог ловит незаметный
        # рост echarts/sql.js и случайно попавшие в бандл картинки.
        run: |
          SIZE=$(du -sk dist/assets | cut -f1)
          echo "dist/assets: ${SIZE} KiB"
          if [ "$SIZE" -gt 4000 ]; then
            echo "::error::Бандл вырос до ${SIZE} KiB (порог 4000). Проверьте, что попало в сборку."
            exit 1
          fi

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Package desktop application
        run: bun run desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify packaged application exists
        shell: pwsh
        run: if (-not (Test-Path -LiteralPath 'release/win-unpacked/THEDAD.exe')) { throw 'Packaged executable not found' }
      - name: Test packaged desktop persistence
        run: bunx playwright test e2e/desktop-window.spec.ts --project=laptop --grep "packaged Windows app"

  sync-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thedad
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: thedad
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thedad -d thedad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix server
      - name: Build with sync enabled
        run: bun run build
        env:
          VITE_FEATURE_PLUS: '1'
          VITE_SYNC_SERVER_URL: http://localhost:8787
      - name: Start isolated sync server
        env:
          DATABASE_URL: postgres://thedad:test-only@localhost:5432/thedad
          ALLOWED_ORIGINS: http://localhost:4174
        run: |
          node server/index.js > "$RUNNER_TEMP/sync-server.log" 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:8787/health; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/sync-server.log"
          exit 1
      - run: bunx playwright install --with-deps chromium
      - name: Test concurrent sync against PostgreSQL
        run: bunx playwright test e2e/sync-server.spec.ts --project=laptop --workers=1
        env:
          E2E_SYNC_SERVER: http://localhost:8787
