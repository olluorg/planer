<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>THEDAD — планер целей</title>
        <meta name="theme-color" content="#0a0a0a" />
        <!-- iOS: запуск с домашнего экрана как отдельное приложение -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="THEDAD" />
        <script src="/theme-init.js"></script>
        <!-- Шрифт Inter подключается из src/index.css (@fontsource-variable/inter):
             сборщик сам кладёт нужные подмножества в dist, ничего не тянется со стороны. -->

        <!-- Тема-зависимая иконка вкладки: тёмный под на светлой теме, белый — на тёмной -->
        <link rel="icon" type="image/png" href="/logo-light.png" media="(prefers-color-scheme: light)" />
        <link rel="icon" type="image/png" href="/logo-dark.png" media="(prefers-color-scheme: dark)" />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body class="bg-bg text-text antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
