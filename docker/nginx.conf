# SPA: любой путь без файла отдаём как index.html (роутер разберётся).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WASM (sql.js) должен отдаваться с правильным MIME, иначе браузер откажется компилировать
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хэшированные ассеты можно кешировать навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
